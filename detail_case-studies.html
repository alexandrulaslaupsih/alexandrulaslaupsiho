  <script>
(function () {
  const STORAGE_KEY = "alex_cookie_consent";
  const banner = document.getElementById("alex-cookie-banner");
  const acceptButton =
    document.getElementById("alex-cookie-accept");
  const rejectButton =
    document.getElementById("alex-cookie-reject");
  const settingsButton =
    document.getElementById("alex-cookie-settings");
  /* -----------------------------------------
     Google Consent
     ----------------------------------------- */
  function updateConsent(analyticsGranted) {
    if (analyticsGranted) {
      gtag("consent", "update", {
        analytics_storage: "granted"
      });
    } else {
      gtag("consent", "update", {
        analytics_storage: "denied"
      });
    }
  }
  /* -----------------------------------------
     Banner
     ----------------------------------------- */
  function showBanner() {
    banner.style.display = "block";
  }
  function hideBanner() {
    banner.style.display = "none";
  }
  /* -----------------------------------------
     Save preference
     ----------------------------------------- */
  function saveConsent(value) {
    localStorage.setItem(
      STORAGE_KEY,
      value
    );
  }
  /* -----------------------------------------
     Read preference
     ----------------------------------------- */
  function getConsent() {
    return localStorage.getItem(
      STORAGE_KEY
    );
  }
  /* -----------------------------------------
     Existing preference
     ----------------------------------------- */
  const existingConsent = getConsent();
  if (existingConsent === "accepted") {
    updateConsent(true);
    hideBanner();
  }
  else if (existingConsent === "rejected") {
    updateConsent(false);
    hideBanner();
  }
  else {
    showBanner();
  }
  /* -----------------------------------------
     ACCEPT
     ----------------------------------------- */
  acceptButton.addEventListener(
    "click",
    function () {
      saveConsent("accepted");
      updateConsent(true);
      hideBanner();
    }
  );
  /* -----------------------------------------
     REJECT
     ----------------------------------------- */
  rejectButton.addEventListener(
    "click",
    function () {
      saveConsent("rejected");
      updateConsent(false);
      hideBanner();
    }
  );
  /* -----------------------------------------
     PREFERENCES
     Pentru moment redeschide bannerul.
     Putem transforma ulterior într-un
     panou separat pentru categorii.
     ----------------------------------------- */
  settingsButton.addEventListener(
    "click",
    function () {
      showBanner();
    }
  );
})();
</script>
